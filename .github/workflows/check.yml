name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Install JSON3
        run: julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
      - name: Check the tables against the data, [AKN] and Angeltveit's quotient
        run: julia --project=scripts scripts/build.jl --check
